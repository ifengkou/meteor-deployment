services:
  mysql:
    environment:
      METOR_DATABASE: ${METOR_DATABASE:?set METOR_DATABASE}
      METOR_DB_USER: ${METOR_DB_USER:?set METOR_DB_USER}
      METOR_DB_PASSWORD: ${METOR_DB_PASSWORD:?set METOR_DB_PASSWORD}

  metor:
    image: ${METOR_IMAGE:-metor-service:0.1.0}
    platform: ${METOR_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-runtime:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/${METOR_DATABASE}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${METOR_DB_USER}
      DB_PASSWORD: ${METOR_DB_PASSWORD}
      METOR_PLATFORM_SECURITY_JWT_SECRET: ${METOR_PLATFORM_SECURITY_JWT_SECRET:?set METOR_PLATFORM_SECURITY_JWT_SECRET}
      METOR_PLATFORM_SECURITY_ISSUER: ${METOR_PLATFORM_SECURITY_ISSUER:-metor-service}
      METOR_PLATFORM_SECURITY_ACCESS_TOKEN_TTL: ${METOR_PLATFORM_SECURITY_ACCESS_TOKEN_TTL:-20m}
      METOR_PLATFORM_SECURITY_REFRESH_TOKEN_TTL: ${METOR_PLATFORM_SECURITY_REFRESH_TOKEN_TTL:-14d}
      METOR_PLATFORM_SECURITY_MAX_LOGIN_FAILURES: ${METOR_PLATFORM_SECURITY_MAX_LOGIN_FAILURES:-5}
      METOR_PLATFORM_SECURITY_LOCK_DURATION: ${METOR_PLATFORM_SECURITY_LOCK_DURATION:-15m}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-60s}
      METOR_AEROSPACE_STORAGE_ROOT: /data/metor
      LOG_PATH: /data/metor/logs
      METOR_AEROSPACE_STORAGE_BASE_PATH: /data/metor/ai631/
      METOR_AEROSPACE_RULES_CONFIG_PATH: /opt/metor/ai631/conf
      METOR_AEROSPACE_DIAGNOSIS_MAX_POWER_UP_DIFF_MILLIS: ${METOR_AEROSPACE_DIAGNOSIS_MAX_POWER_UP_DIFF_MILLIS:-40000}
      METOR_AEROSPACE_DIAGNOSIS_MAX_POWER_DOWN_DIFF_MILLIS: ${METOR_AEROSPACE_DIAGNOSIS_MAX_POWER_DOWN_DIFF_MILLIS:-60000}
      METOR_AEROSPACE_DIAGNOSIS_MAX_AI_JUDGE_EVENT_NUM: ${METOR_AEROSPACE_DIAGNOSIS_MAX_AI_JUDGE_EVENT_NUM:-15}
      METOR_AEROSPACE_DIAGNOSIS_INSPECTION_TYPE: ${METOR_AEROSPACE_DIAGNOSIS_INSPECTION_TYPE:-1}
      METOR_AEROSPACE_DIAGNOSIS_ENABLED: ${METOR_AEROSPACE_DIAGNOSIS_ENABLED:-true}
      METOR_AEROSPACE_DIAGNOSIS_DICTIONARY_REFRESH_INTERVAL: ${METOR_AEROSPACE_DIAGNOSIS_DICTIONARY_REFRESH_INTERVAL:-PT10M}
      METOR_AEROSPACE_AI_ENABLED: ${METOR_AEROSPACE_AI_ENABLED:-true}
      METOR_AEROSPACE_AI_BASE_URL: http://ai-runtime:8090
      METOR_AEROSPACE_AI_CONNECT_TIMEOUT: ${METOR_AEROSPACE_AI_CONNECT_TIMEOUT:-5s}
      METOR_AEROSPACE_AI_READ_TIMEOUT: ${METOR_AEROSPACE_AI_READ_TIMEOUT:-60s}
      METOR_AEROSPACE_AI_NETWORK_MAX_RETRIES: ${METOR_AEROSPACE_AI_NETWORK_MAX_RETRIES:-2}
      METOR_AEROSPACE_AI_LLM_MAX_RETRIES: ${METOR_AEROSPACE_AI_LLM_MAX_RETRIES:-2}
      METOR_AEROSPACE_AI_SCENES_CAUSE_JUDGE: ${METOR_AEROSPACE_AI_SCENES_CAUSE_JUDGE:-cause-judge}
      METOR_AEROSPACE_AI_SCENES_CAUSE_JUDGE_REVIEW: ${METOR_AEROSPACE_AI_SCENES_CAUSE_JUDGE_REVIEW:-cause-judge-review}
      METOR_AEROSPACE_AI_SCENES_REPORT_QUERY: ${METOR_AEROSPACE_AI_SCENES_REPORT_QUERY:-report-query}
      METOR_AEROSPACE_AI_SCENES_INSPECTION_NODE: ${METOR_AEROSPACE_AI_SCENES_INSPECTION_NODE:-inspection-node}
      METOR_AEROSPACE_AI_SCENES_INSPECTION_SUMMARY: ${METOR_AEROSPACE_AI_SCENES_INSPECTION_SUMMARY:-inspection-summary}
      METOR_AEROSPACE_AI_SCENES_TICKET_KEYWORD: ${METOR_AEROSPACE_AI_SCENES_TICKET_KEYWORD:-ticket-keyword}
      METOR_AEROSPACE_DECRYPTION_ENABLED: ${METOR_AEROSPACE_DECRYPTION_ENABLED:-false}
      METOR_AEROSPACE_DECLARATION_MAX_LOG_FILES: ${METOR_AEROSPACE_DECLARATION_MAX_LOG_FILES:-20}
      METOR_AEROSPACE_DECRYPTION_LIBRARY_PATH: /usr/local/lib/libEncryptAndDecrypt.so
    ports:
      - ${METOR_BIND_ADDRESS:-127.0.0.1}:${APP_EXPOSED_PORT:-8080}:8080
    volumes:
      - metor-data:/data/metor
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks: [backend]

volumes:
  metor-data:
